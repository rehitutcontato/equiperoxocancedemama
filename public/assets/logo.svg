<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E8E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9D174D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7EC" />
      <stop offset="100%" stop-color="#E8C5C8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E11D48" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ribbon Icon -->
  <g transform="translate(10, 8)" filter="url(#softGlow)">
    <!-- Back Loop -->
    <path d="M 32,8 C 22,8 14,18 18,32 C 22,46 36,60 46,70 C 44,56 46,42 42,32 C 38,22 42,8 32,8 Z" fill="url(#ribbonGrad)" opacity="0.85" />
    <!-- Front Loop Crossing -->
    <path d="M 32,8 C 42,8 50,18 46,32 C 40,46 26,60 16,70 C 18,56 16,42 20,32 C 24,22 20,8 32,8 Z" fill="url(#ribbonGrad)" />
    <!-- Center Knot Pin Highlight -->
    <circle cx="32" cy="24" r="3.5" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- Typography: Editorial Luxury -->
  <text x="82" y="38" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#4A072B" letter-spacing="-0.5">
    Rosa <tspan fill="#E11D48">em</tspan> Alerta
  </text>
  <text x="84" y="56" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#9D174D" letter-spacing="0.5" opacity="0.9">
    Informação, cuidado e prevenção.
  </text>
</svg>
